  <head>
    <script>
      // Suppress benign iframe dev websocket and firestore offline mode warnings from appearing in error scrapers
      (function() {
        if (typeof window === 'undefined') return;

        // Catch error events at the window level before bubble
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message : '';
          var filename = (e && e.filename) ? e.filename : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            filename.indexOf('@vite/client') !== -1
          ) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
          if (msg.indexOf('Failed to fetch dynamically imported module') !== -1 || msg.indexOf('Loading chunk') !== -1) {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.update(); });
              });
            }
            setTimeout(function() { window.location.reload(); }, 300);
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e ? e.reason : '';
          var msg = typeof reason === 'string' ? reason : (reason && reason.message ? reason.message : '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('closed without opened') !== -1
          ) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        }, true);

        var origError = console.error;
        console.error = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) {
            return typeof a === 'string' ? a : (a && a.message ? a.message : '');
          }).join(' ');
          if (str.indexOf('[vite]') !== -1 && (str.indexOf('websocket') !== -1 || str.indexOf('failed to connect') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1)) {
            return;
          }
          if (str.indexOf('@firebase/firestore') !== -1 && (str.indexOf('Could not reach Cloud Firestore backend') !== -1 || str.indexOf('operate in offline mode') !== -1 || str.indexOf('Collect garbage') !== -1 || str.indexOf('primary lease') !== -1)) {
            return;
          }
          return origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) {
            return typeof a === 'string' ? a : (a && a.message ? a.message : '');
          }).join(' ');
          if (str.indexOf('[vite]') !== -1 && (str.indexOf('websocket') !== -1 || str.indexOf('failed to connect') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1)) {
            return;
          }
          if (str.indexOf('@firebase/firestore') !== -1 && (str.indexOf('Could not reach Cloud Firestore backend') !== -1 || str.indexOf('operate in offline mode') !== -1 || str.indexOf('Collect garbage') !== -1 || str.indexOf('primary lease') !== -1)) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
      })();
    </script>
